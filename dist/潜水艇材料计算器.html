<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潜水艇材料计算器</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e5e8ec; --text:#1f2329; --muted:#7b838d;
  --accent:#2f6fed; --accent-soft:#eaf1ff; --warn:#c2410c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:13.5px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5}
h1{font-size:15.5px;margin:0;font-weight:600}
#code{font:600 15px/1 ui-monospace,Consolas,monospace;color:var(--accent);
  background:var(--accent-soft);padding:6px 10px;border-radius:6px}
.grow{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
  color:var(--text);padding:6px 12px;border-radius:7px}
button:hover{border-color:#c8cfd8}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#2a63d4}

main{display:flex;gap:14px;padding:14px 18px;align-items:flex-start}
aside{width:272px;flex:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px}
.slot{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.slot .lb{width:34px;flex:none;font-size:12.5px;color:var(--muted)}
.slot select{font:inherit;font-size:12px;padding:5px 5px;
  border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);min-width:0}
.slot select.part{flex:1}
.slot select.qty{width:54px;flex:none}
.design{margin-top:4px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--muted);line-height:1.9}
.design b{color:var(--text);font-weight:600}

section.panel{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  padding:8px 14px;border-bottom:1px solid var(--line);background:#fbfcfd;
  font-size:12.5px;color:var(--muted)}
.sum b{color:var(--text);font:600 13.5px/1 ui-monospace,monospace}
.sum .miss b{color:var(--warn)}

/* 四列用 flex：默认正好均分；拖动只改比例，窗口怎么变都塞得下 */
.board{display:flex;flex-wrap:nowrap;overflow-x:auto;align-items:stretch}
.col{flex:1 1 0;min-width:0;padding:10px 12px 16px;border-left:1px solid var(--line)}
.col:first-child{border-left:none;padding-left:14px}
.gutter{flex:0 0 7px;align-self:stretch;cursor:col-resize;position:relative;touch-action:none}
.gutter::after{content:'';position:absolute;left:3px;top:10px;bottom:10px;width:1px;
  background:#dfe4ea;border-radius:1px}
.gutter:hover::after{background:var(--accent);width:2px;left:2px}
body.resizing{cursor:col-resize;user-select:none}
.col h2{font-size:12px;margin:0 0 7px;font-weight:600;color:var(--muted);
  letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col h2 label{display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:600}
.col h2 span{font-weight:400;color:#a8afb8}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:5px;align-items:center;padding:3px 4px;border-radius:5px;
  font-size:12.5px}
.row:hover{background:#f7f9fb}
.row.sub{padding-left:12px}
.row.sub .nm{color:#5f6873}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .qt{font:600 12px/1 ui-monospace,monospace;color:var(--accent);white-space:nowrap}
.row.enough .nm,.row.enough .qt{color:#8f97a1;text-decoration:line-through;
  text-decoration-thickness:1.5px;text-decoration-color:#9aa2ac}
.row.enough .chip{opacity:.45}
.row.crystal .nm{color:#0e7490}
.pick{width:14px;height:14px;flex:none;margin:0 1px;accent-color:var(--accent);cursor:pointer}
/* 合建进度面板 */
.prog{position:fixed;top:58px;right:18px;width:360px;max-height:calc(100vh - 90px);overflow:auto;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:20;padding:10px 12px}
.prog.hidden{display:none}
.prog-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.prog-head b{color:var(--text)}
.prog-head button{margin-left:auto}
.prog-part{margin-bottom:10px}
.prog-name{font-weight:600;font-size:12px;margin-bottom:3px;color:#33404d}
.prog-row{display:flex;align-items:center;gap:6px;padding:1px 2px;font-size:12px;border-radius:4px}
.prog-row:hover{background:#f4f7fa}
.prog-phase{display:flex;align-items:center;gap:6px;margin:7px 0 2px;font-size:12px;
  font-weight:600;color:#33404d;cursor:pointer}
.prog-phase.done span{color:#98a1ab;text-decoration:line-through}
.prog-phase.locked{color:#b6bcc4;cursor:default}
.prog-mats{padding-left:18px;margin-bottom:2px}
.prog-mats.locked{opacity:.45}
.prog-mat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-qty{color:var(--accent);font:600 11px/1 ui-monospace,monospace}
.prog-empty{color:var(--muted);font-size:12px;padding:6px 2px}
.ownwrap{width:52px;flex:none;display:inline-block}
.own{width:100%;font:11px/1 ui-monospace,monospace;text-align:right;
  padding:2px 3px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text)}
.own:focus{outline:none;border-color:var(--accent)}
.own:disabled{background:#f2f4f6;color:#aab2bb}
.note{font-size:11px;color:#98a1ab;line-height:1.5;padding:0 4px 2px 57px}
.note div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .exch{color:#8b5a2b;background:transparent;border:0}
.note .done-note{color:#a9b0b8;text-decoration:line-through}
/* 分组 = 独立卡片（边框 + 浅底），和下面的普通材料彻底分开 */
.groups{margin-bottom:10px}
.xgroup{border:1px solid #d9e5ea;background:#f5fafc;border-radius:8px;
  margin-bottom:6px;overflow:hidden}
.xtoggle{width:100%;text-align:left;cursor:pointer;font:inherit;font-size:11.5px;
  color:#0b6b7f;background:transparent;border:none;border-radius:0;
  padding:6px 9px;font-weight:600}
.xtoggle:hover{background:#e8f6f9}
.xbody{padding:3px 7px 8px;border-top:1px dashed #d3e6ea;background:#fbfdfe}
.xgroup.closed .xbody{display:none}
.xgroup.g-seal{border-left:3px solid #d97706}
.xgroup.g-crystal{border-left:3px solid #0891b2}
.xgroup.g-sub{border-left:3px solid #2563eb}
.xgroup.g-exch{border-left:3px solid #7c3aed}
.xgroup.g-tribe{border-left:3px solid #92400e}
.exch{font:600 9.5px/1 -apple-system,"Microsoft YaHei",sans-serif;color:#fff;
  background:#0e7490;padding:3px 4px;border-radius:3px;margin-right:4px;flex:none}
.tag{font:600 10px/1 ui-monospace,monospace;color:#fff;background:#94a3b8;
  padding:3px 4px;border-radius:4px;margin-right:4px}
.tag.mod{background:#8b5cf6}
.empty{color:#b6bcc4;font-size:12px;padding:8px 4px}
footer{padding:8px 18px 22px;color:var(--muted);font-size:12px}
@media (max-width:1200px){
  .board{flex-wrap:wrap}
  .col{flex:1 1 calc(50% - 8px)}
  #col2{border-left:none}
  .gutter{display:none}
}
@media (max-width:760px){
  main{flex-direction:column} aside{width:100%}
  .col{flex:1 1 100%;border-left:none;border-top:1px solid var(--line)}
  #col0{border-top:none}
}
</style>
</head>
<body>
<header>
  <h1>潜水艇材料计算器</h1>
  <span id="code">—</span>
  <span class="grow"></span>
  <button id="progBtn">合建进度</button>
  <button id="copy">复制缺料清单</button>
  <button id="csv" class="primary">导出 CSV</button>
</header>
<div id="progPanel" class="prog hidden">
  <div class="prog-head"><b>合建进度</b><span>勾选已经交给工程的材料</span><button id="progClose">关闭</button></div>
  <div id="progBody"></div>
</div>

<main>
  <aside id="slots"></aside>
  <section class="panel">
    <div class="sum" id="sum"></div>
    <div class="board" id="board">
      <div class="col" id="col0"><h2><label><input type="checkbox" id="all0">配件队列</label><span id="c0"></span></h2><div class="list" id="l0"></div></div>
      <div class="gutter" data-i="0"></div>
      <div class="col" id="col1"><h2><label><input type="checkbox" id="all1" title="合建时直接交给工程的半成品">合建提交</label><span id="c1"></span></h2><div class="list" id="l1"></div></div>
      <div class="gutter" data-i="1"></div>
      <div class="col" id="col2"><h2><label><input type="checkbox" id="all2" title="合建提交物品的配方材料，原料与半成品都在这一列">第三层</label><span id="c2"></span></h2><div class="list" id="l2"></div></div>
      <div class="gutter" data-i="2"></div>
      <div class="col" id="col3"><h2><label><input type="checkbox" id="all3" title="全套配方的基础材料总账：第三层原料继承 + 第三层半成品再拆出的原料">第四层</label><span id="c3"></span></h2><div class="list" id="l3"></div></div>
    </div>
  </section>
</main>

<footer id="foot"></footer>

const PART_IDS = DATA.partIds;
const ITEMS = DATA.items;

function itemOf(id){ return ITEMS[String(id)]; }

// 水晶 / 碎晶 / 晶簇
function isCrystal(name){ return /水晶|碎晶|晶簇/.test(name); }

// 获取方式标签
const TAG_SHORT = {
  'NPC售卖': 'NPC',
  '军票兑换': '军票',
  '可采集': '采集',
  '潜水艇带取': '潜艇',
  '风茄兑换': '风茄',
  '薰衣草兑换': '薰衣草',
  '蛮族商人': '蛮族',
  '限时采集': '限时采集',
  '制作': '制作'
};
function sealCost(id){ return (DATA.seals && DATA.seals[String(id)]) || 0; }
function tagsOf(id){ return (DATA.tags && DATA.tags[String(id)]) || []; }
function isDirectBuy(id){
  const n = ITEMS[String(id)];
  return !!(n && DATA.directBuy && DATA.directBuy.indexOf(n.名称) >= 0);
}
function tagHtml(id, hidden){
  const skip = hidden || [];
  const direct = isDirectBuy(id);
  return tagsOf(id).filter(function(t){
    if(skip.indexOf(t) >= 0) return false;
    if(direct && t === '制作') return false;   // 直购材料：不显示「制作」
    return true;
  }).map(function(t){
    var label = TAG_SHORT[t] || t;
    var title = t;
    if(t === 'NPC售卖' && DATA.prices && DATA.prices[String(id)]){
      label = DATA.prices[String(id)] + 'G';
      title = 'NPC售卖：' + DATA.prices[String(id)] + ' 金币';
    }
    return '<span class="chip ' + (TAG_CLASS[t] || '') + '" title="' + title + '">' +
           label + '</span>';
  }).join('');
}
const TAG_CLASS = {
  'NPC售卖': 'c-npc', '军票兑换': 'c-seal', '可采集': 'c-gather',
  '潜水艇带取': 'c-sub', '风茄兑换': 'c-ex1', '薰衣草兑换': 'c-ex2',
  '蛮族商人': 'c-tribe', '限时采集': 'c-time', '制作': 'c-craft'
};
const ALL_TAGS = Object.keys(TAG_SHORT);

// 风茄 / 薰衣草兑换：这一行还差多少 → 需要多少货币（缺口 ÷ 兑换数，向上取整）
function exchLine(id, deficit){
  const e = DATA.exchange && DATA.exchange[String(id)];
  if(!e || !(deficit > 0)) return '';
  const parts = [];
  for(const k in e){
    const pair = e[k];
    const total = Math.ceil(Number(deficit) * pair[0] / pair[1]);
    parts.push('需 ' + total + ' ' + k + '兑换 1：' + pair[1]);
  }
  return parts.join('　');
}

// 蛮族商人：这些材料在哪个蛮族商人那里用金币买
function tribeLine(id){
  const v = DATA.tribes && DATA.tribes[String(id)];
  if(!v || !v.length) return '';
  return v.join('、') + ' 有售';
}

/**
 * 分组：四组都按「筛选」处理——进了组就从主列表里拿掉，不会重复出现。
 *   军票 / 水晶：原来的口径
 *   仅潜水艇带取：除了潜艇没有别的获取途径的材料（有配方也算别的途径）
 *   风茄·薰衣草兑换：带这两种货币兑换标签的材料
 * 优先级：军票 > 水晶 > 仅潜艇 > 兑换（一个物品只进一个组）
 */
function splitGroups(list){
  const seal = [], crystal = [], sub = [], exch = [], tribe = [], rest = [];
  for(const it of list){
    const ts = tagsOf(it.id);
    if(sealCost(it.id) > 0){ seal.push(it); continue; }
    if(isCrystal(it.name)){ crystal.push(it); continue; }
    if(ts.length === 1 && ts.indexOf('潜水艇带取') >= 0){ sub.push(it); continue; }
    if(ts.indexOf('风茄兑换') >= 0 || ts.indexOf('薰衣草兑换') >= 0){ exch.push(it); continue; }
    if(ts.indexOf('蛮族商人') >= 0){ tribe.push(it); continue; }
    rest.push(it);
  }
  return {seal: seal, crystal: crystal, sub: sub, exch: exch, tribe: tribe, rest: rest};
}

/**
 * 四层口径（2026-11-20 改版）：
 *   配件队列 = 选中的部件；改级部件再多带一个「不改级本体」（1:1 兑换骨架）
 *   合建提交 = 各部件配方的材料（改级跳过骨架），即合建时直接交的半成品
 *   第三层   = 合建提交物品的配方材料，原样保留：原料与半成品混排，不筛选
 *   第四层   = 第三层原料（继承，数量不变）+ 第三层半成品再拆出的原料 = 全套基础材料
 *
 * 取整：每个父项各自 ceil(需要 / 产量) 后相加（与原口径一致）。
 */
function compute(selections, owned, prog){
  owned = owned || {};
  prog = prog || {};
  const join = {};
  const l3 = {};
  const base = {};
  const remain = {};

  function consume(id, qty){
    const k = String(id);
    const raw = Number(owned[k]);
    if(remain[k] === undefined) remain[k] = raw === -1 ? -1 : Math.max(0, Math.floor(raw || 0));
    let used;
    if(remain[k] === -1){
      used = qty;
    }else{
      used = Math.min(remain[k], qty);
      remain[k] -= used;
    }
    return {used: used, deficit: qty - used};
  }

  function add(map, id, name, need, used, parentName){
    const k = String(id);
    if(!map[k]) map[k] = {id:k, name:name, need:0, have:0, parents:{}, verbs:{}};
    const e = map[k];
    e.need += need;
    e.have += used;
    if(parentName){
      e.parents[parentName] = (e.parents[parentName] || 0) + need;
      e.verbs[parentName] = '制作';
    }
    return e;
  }

  function isCraftable(node){ return !!(node && node.材料 && node.材料.length); }

  // 能不能自己做：白名单里的材料一律视为「直接买」，不往下拆
  function canMake(id){
    const node = itemOf(id);
    if(!node) return false;
    if(DATA.directBuy && DATA.directBuy.indexOf(node.名称) >= 0) return false;
    return isCraftable(node);
  }

  function craftsOf(node, deficit){
    const y = Math.max(node.产量 || 1, 1);
    return Math.ceil(deficit / y);
  }

  // 第四层：只收材料（无配方或白名单直购）
  function deep(id, qty, parentName){
    const node = itemOf(id);
    if(!node) return;
    const c = consume(id, qty);
    if(!canMake(id)){
      add(base, id, node.名称, qty, c.used, parentName);
      return;
    }
    if(c.deficit <= 0) return;
    const n = craftsOf(node, c.deficit);
    for(const m of node.材料){
      deep(m.id, n * m.数量, node.名称);
    }
  }

  // 第三层：全部计入；本身是材料的同时继承进第四层
  function level3(id, qty, parentName){
    const node = itemOf(id);
    if(!node) return;
    const c = consume(id, qty);
    add(l3, id, node.名称, qty, c.used, parentName);
    if(!canMake(id)){
      add(base, id, node.名称, qty, c.used, parentName);
      return;
    }
    if(c.deficit <= 0) return;
    const n = craftsOf(node, c.deficit);
    for(const m of node.材料){
      deep(m.id, n * m.数量, node.名称);
    }
  }

  // 合建提交：单个材料（部件配方的材料，改级跳过骨架）
  // already=true 表示这一阶段已经交过：行要保留（划线），但不再往下拆材料
  function joinMat(id, need, partName, already){
    const mn = itemOf(id);
    if(!mn || mn.来源 === 'frame') return;
    if(already){
      const je = add(join, id, mn.名称, need, need, null);
      je.doneParents = je.doneParents || {};
      je.doneParents[partName] = (je.doneParents[partName] || 0) + need;
      if(!canMake(id)){
        const be = add(base, id, mn.名称, need, need, null);
        be.doneParents = be.doneParents || {};
        be.doneParents[partName] = (be.doneParents[partName] || 0) + need;
      }
      return;
    }
    const c = consume(id, need);
    add(join, id, mn.名称, need, c.used, partName);
    if(!canMake(id)){
      add(base, id, mn.名称, need, c.used, partName);
      return;
    }
    if(c.deficit <= 0) return;
    const n = craftsOf(mn, c.deficit);
    for(const x of mn.材料){
      level3(x.id, n * x.数量, mn.名称);
    }
  }

  // 合建提交：按阶段展开；已完成的阶段保留成「已备齐」的行，不再消耗材料
  function joinOf(partNode, crafts){
    const phases = DATA.phases && DATA.phases[partNode.名称];
    if(phases && phases.length){
      const done = prog[partNode.名称] || 0;
      phases.forEach(function(mats, i){
        const already = i < done;
        for(const m of mats){
          joinMat(m.id, crafts * m.数量, partNode.名称, already);
        }
      });
      return;
    }
    for(const m of partNode.材料){
      joinMat(m.id, crafts * m.数量, partNode.名称, false);
    }
  }

  for(const s of selections){
    if(!s) continue;
    const pid = PART_IDS[s.name];
    const node = itemOf(pid);
    if(!node) continue;
    const c = consume(pid, s.qty);
    if(c.deficit <= 0) continue;
    const n = craftsOf(node, c.deficit);
    joinOf(node, n);

    // 改级：骨架 1:1 兑换成不改级本体，本体自己也要合建一次
    const frame = (node.材料 || []).filter(m=>{
      const f = itemOf(m.id);
      return f && f.来源 === 'frame';
    })[0];
    if(frame){
      const fm = itemOf(frame.id);
      const donorId = fm && fm.材料 && fm.材料[0] ? fm.材料[0].id : null;
      const donor = donorId ? itemOf(donorId) : null;
      if(donor){
        const dc = consume(donorId, frame.数量 * n);
        if(dc.deficit > 0) joinOf(donor, craftsOf(donor, dc.deficit));
      }
    }
  }

  return {join:join, l3:l3, base:base};
}

function toList(map){
  return Object.keys(map).map(k=>{
    const e = map[k];
    e.deficit = Math.max(0, e.need - e.have);
    return e;
  });
}

// 排序：水晶类置顶，其余按「配方树就近」的全局序号（构建时算好，换部件也不会重排）
function bySeq(list, crystalFirst){
  return list.slice().sort((a,b)=>{
    if(crystalFirst){
      const ca = isCrystal(a.name), cb = isCrystal(b.name);
      if(ca !== cb) return ca ? -1 : 1;
    }
    const sa = ITEMS[a.id] ? ITEMS[a.id].seq : 9e9;
    const sb = ITEMS[b.id] ? ITEMS[b.id].seq : 9e9;
    return sa - sb;
  });
}

// 备注只记上一层：「其中 n 个用于制作/兑换 Y」
function noteItems(item){
  const out = [];
  const mk = (p, n, done) => out.push({
    n: n,
    done: done,
    text: '其中 ' + n + ' 个用于' + ((item.verbs && item.verbs[p]) || '制作') + ' ' + p
  });
  Object.keys(item.parents || {}).forEach(p => mk(p, item.parents[p], false));
  Object.keys(item.doneParents || {}).forEach(p => mk(p, item.doneParents[p], true));
  return out.sort((a, b) => b.n - a.n);
}

function noteLines(item){
  return noteItems(item).map(x => x.text);
}

// 四位：无 = 0；四件都是改级才加「改」
function buildCode(selections){
  let digits = '', any = false, allMod = true;
  for(const s of selections){
    if(!s){ digits += '0'; continue; }
    const p = DATA.parts.find(x=>x.全名===s.name);
    digits += String(p.级别);
    any = true;
    if(p.是否改级 !== '是') allMod = false;
  }
  return any ? digits + (allMod ? '改' : '') : '—';
}
</script>

<script>
(function(){
  const SLOTS = ['船体','船尾','船首','舰桥'];
  const SEL = {}, QTY = {};
  const owned = {};        // id -> 数量；-1 = 管够
  const OPEN = {};         // 分组展开状态："l3:g-sub" -> true（重绘时不能丢）
  const PROG = {};         // 合建进度：{部件全名: {材料名: true}}，已交给工程的材料
  let last = null;

  // ---------- 左侧：部位 + 数量 ----------
  const aside = document.getElementById('slots');

  // 常用套装：选中后自动填四个部位
  const presetRow = document.createElement('div');
  presetRow.className = 'slot preset-row';
  const pLabel = document.createElement('span');
  pLabel.className = 'lb';
  pLabel.textContent = '套装';
  const pSel = document.createElement('select');
  pSel.className = 'part';
  const pCustom = document.createElement('option');
  pCustom.value = '-1';
  pCustom.textContent = '— 自定义 —';
  pSel.appendChild(pCustom);
  (DATA.presets || []).forEach(function(p, i){
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = p.名称;
    pSel.appendChild(o);
  });
  const pQty = document.createElement('select');
  pQty.className = 'qty';
  for(let i=1;i<=5;i++){
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = '×' + i;
    pQty.appendChild(o);
  }
  presetRow.appendChild(pLabel);
  presetRow.appendChild(pSel);
  presetRow.appendChild(pQty);
  aside.appendChild(presetRow);

  for(const slot of SLOTS){
    const row = document.createElement('div');
    row.className = 'slot';
    const lb = document.createElement('span');
    lb.className = 'lb';
    lb.textContent = slot;

    const sel = document.createElement('select');
    sel.className = 'part';
    const none = document.createElement('option');
    none.value = '';
    none.textContent = '— 无 —';
    sel.appendChild(none);
    const group = DATA.parts.filter(p=>p.部件===slot)
      .sort((a,b)=> a.级别 - b.级别 || (a.是否改级==='是') - (b.是否改级==='是'));
    for(const p of group){
      const o = document.createElement('option');
      o.value = p.全名;
      o.textContent = p.配装字符 + '  ' + p.全名;
      sel.appendChild(o);
    }
    sel.value = '';

    const qty = document.createElement('select');
    qty.className = 'qty';
    for(let i=1;i<=5;i++){
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = '×' + i;
      qty.appendChild(o);
    }
    sel.addEventListener('change', render);
    qty.addEventListener('change', render);
    row.appendChild(lb); row.appendChild(sel); row.appendChild(qty);
    aside.appendChild(row);
    SEL[slot] = sel; QTY[slot] = qty;
  }
  pSel.addEventListener('change', function(){
    const idx = parseInt(pSel.value, 10);
    if (isNaN(idx) || idx < 0) return;
    const preset = (DATA.presets || [])[idx];
    if (!preset) return;
    SLOTS.forEach(function(slot, i){
      const name = preset.选择[i];
      SEL[slot].value = name || '';
      QTY[slot].value = pQty.value;
    });
    render();
  });

  pQty.addEventListener('change', function(){
    SLOTS.forEach(function(slot){ QTY[slot].value = pQty.value; });
    render();
  });

  const designBox = document.createElement('div');
  designBox.className = 'design';
  aside.appendChild(designBox);

  function selections(){
    return SLOTS.map(slot=>{
      if(!SEL[slot].value) return null;
      return {name: SEL[slot].value, qty: parseInt(QTY[slot].value, 10) || 1, slot: slot};
    });
  }
  function partInfo(name){ return DATA.parts.find(x=>x.全名===name); }

  // 改级部件 → 它的骨架 → 骨架 1:1 兑换来源（不改级本体）
  function frameOf(name){
    const pid = DATA.partIds[name];
    const node = pid ? ITEMS[String(pid)] : null;
    if(!node) return null;
    for(const m of (node.材料 || [])){
      const f = ITEMS[String(m.id)];
      if(f && f.来源 === 'frame' && f.材料 && f.材料[0]){
        return {frameId:m.id, frameName:f.名称, donorId:f.材料[0].id, donorName:f.材料[0].名称};
      }
    }
    return null;
  }

  // ---------- 渲染 ----------
  function render(){
    const sel = selections();
    const code = buildCode(sel);
    document.getElementById('code').textContent = code;

    const designs = new Set();
    for(const s of sel){
      if(!s) continue;
      const rec = DATA.recipes[s.name];
      if(rec && rec.解锁设计图) designs.add(rec.解锁设计图);
    }
    const filled = sel.filter(Boolean).length;
    designBox.innerHTML = filled
      ? '已选 <b>' + filled + '</b> / 4 个部位<br>需要设计图：<b>' +
        [...designs].sort().join('、') + '</b>'
      : '四个部位都是「无」，选一个再看看';

    last = compute(sel, owned, PROG);
    const lists = {
      join: bySeq(toList(last.join), true),
      l3: bySeq(toList(last.l3), true),
      base: bySeq(toList(last.base), true)
    };

    // 还缺按第四层（要获取的材料）统计
    const miss = lists.base.filter(x=>x.deficit > 0);
    const missSum = miss.reduce((s,x)=>s+x.deficit,0);
    const totalQty = sel.reduce((s,x)=> s + (x ? x.qty : 0), 0);
    document.getElementById('sum').innerHTML =
      '配装 <b>' + code + '</b>　' +
      (totalQty > 1 ? '共 <b>' + totalQty + '</b> 件　' : '') +
      '合建提交 <b>' + lists.join.length + '</b> 种 / 第三层 <b>' + lists.l3.length + '</b> 种 / ' +
      '第四层 <b>' + lists.base.length + '</b> 种　' +
      '<span class="miss">还缺 <b>' + miss.length + '</b> 种 / <b>' + missSum + '</b> 件</span>';

    renderParts(sel);
    renderProg(sel);
    fillList('l1', lists.join, 'c1', true, true);
    fillList('l2', lists.l3, 'c2', true, true);
    fillList('l3', lists.base, 'c3', true, true);

    bindAll('all0', partRowIds(sel));
    bindAll('all1', lists.join.map(x=>x.id));
    bindAll('all2', lists.l3.map(x=>x.id));
    bindAll('all3', lists.base.map(x=>x.id));
  }

  // 表头全选：勾上 = 全部「管够」，取消 = 全部清零
  function bindAll(boxId, ids){
    const box = document.getElementById(boxId);
    if(!box) return;
    box.checked = ids.length > 0 && ids.every(id=>owned[id] === -1);
    box.onchange = function(){
      if(box.checked) ids.forEach(id=>{ owned[id] = -1; });
      else ids.forEach(id=>{ delete owned[id]; });
      render();
    };
  }

  // 行首勾选框：勾上 = 这个材料已经够数
  function pickBox(id, have){
    return '<input class="pick" type="checkbox" data-pick="' + id + '"' +
           (have === -1 ? ' checked' : '') + ' title="勾上 = 这个已经够数">';
  }

  function ownInput(id, have){
    const maxed = have === -1;
    return '<span class="ownwrap">' +
           '<input class="own" type="number" step="1" data-own="' + id + '"' +
           ' value="' + (!maxed && have > 0 ? have : '') + '"' +
           ' placeholder="0" title="我已有多少（只算差额）"' +
           (maxed ? ' disabled' : '') + '>' +
           '</span>';
  }

  function renderParts(sel){
    const box = document.getElementById('l0');
    let html = '';
    let rows = 0;
    for(const s of sel){
      if(!s){ continue; }
      const p = partInfo(s.name);
      const pid = DATA.partIds[s.name];
      const have = owned[String(pid)];
      const done = have === -1 || have >= s.qty;
      const cls = p.是否改级 === '是' ? 'tag mod' : 'tag';
      html += '<div class="row' + (done ? ' enough' : '') + '">' +
              pickBox(pid, have) +
              '<span class="nm"><span class="' + cls + '">' + p.配装字符 + '</span>' +
              s.slot + ' ' + s.name.replace(/级船|改级船/, '') + '</span>' +
              ownInput(pid, have) +
              '<span class="qt">×' + s.qty + '</span></div>';
      rows++;
      // 改级部件额外带一个不改级本体：1:1 兑换成骨架后交给合建
      const fr = frameOf(s.name);
      if(fr){
        const dhave = owned[String(fr.donorId)];
        const ddone = dhave === -1 || dhave >= s.qty;
        html += '<div class="row sub' + (ddone ? ' enough' : '') + '">' +
                pickBox(fr.donorId, dhave) +
                '<span class="nm"><span class="exch">兑换</span>' + fr.donorName + '</span>' +
                ownInput(fr.donorId, dhave) +
                '<span class="qt">×' + s.qty + '</span></div>' +
                '<div class="note"><div>用于兑换 ' + fr.frameName + '</div></div>';
        rows++;
      }
    }
    box.innerHTML = html || '<div class="empty">未选择部件</div>';
    bindOwn(box);
    document.getElementById('c0').textContent = rows + ' 件';
  }

  // ---------- 合建进度面板 ----------
  function progEntries(sel){
    const out = [];
    for(const s of sel){
      if(!s) continue;
      out.push({name: s.name, qty: s.qty});
      const fr = frameOf(s.name);
      if(fr) out.push({name: fr.donorName, qty: s.qty, donor: true});
    }
    return out;
  }

  function renderProg(sel){
    const box = document.getElementById('progBody');
    if(!box) return;
    let html = '';
    for(const p of progEntries(sel)){
      const phases = DATA.phases && DATA.phases[p.name];
      const done = PROG[p.name] || 0;
      html += '<div class="prog-part"><div class="prog-name">' + p.name +
              (p.donor ? '（兑换骨架用）' : '') + ' ×' + p.qty + '</div>';
      if(phases && phases.length){
        phases.forEach(function(mats, idx){
          const isDone = idx < done;
          const locked = idx > done;
          const unlocked = (idx === done) || (idx === done - 1);
          html += '<label class="prog-phase' + (isDone ? ' done' : '') +
                  (locked ? ' locked' : '') + '">' +
                  '<input type="checkbox" data-prog="' + p.name + '|' + idx + '"' +
                  (isDone ? ' checked' : '') + (unlocked ? '' : ' disabled') + '>' +
                  '<span>阶段 ' + (idx + 1) + ' / ' + phases.length + '</span></label>' +
                  '<div class="prog-mats' + (locked ? ' locked' : '') + '">';
          for(const m of mats){
            html += '<div class="prog-row"><span class="prog-mat">' + m.名称 +
                    '</span><span class="prog-qty">×' + (m.数量 * p.qty) + '</span></div>';
          }
          html += '</div>';
        });
      }
      html += '</div>';
    }
    box.innerHTML = html || '<div class="prog-empty">先在左边选部件</div>';
    box.querySelectorAll('input[data-prog]').forEach(inp=>{
      inp.onchange = function(){
        const bits = inp.dataset.prog.split('|');
        const part = bits[0];
        const idx = parseInt(bits[1], 10);
        const done = PROG[part] || 0;
        if(inp.checked){
          if(idx === done) PROG[part] = done + 1;        // 只能按顺序往下一段
        }else{
          if(idx === done - 1) PROG[part] = idx;         // 只能撤销最后完成的段
        }
        render();
      };
    });
  }

  function partRowIds(sel){
    const ids = [];
    for(const s of sel){
      if(!s) continue;
      ids.push(DATA.partIds[s.name]);
      const fr = frameOf(s.name);
      if(fr) ids.push(fr.donorId);
    }
    return ids;
  }

  function fillList(boxId, list, countId, withNote, groupSpecial){
    const box = document.getElementById(boxId);
    const g = groupSpecial ? splitGroups(list)
                           : {seal: [], crystal: [], sub: [], exch: [], tribe: [], rest: list};

    const rowHtml = (it, hidden) => {
      const crystal = isCrystal(it.name);
      const done = it.deficit <= 0;
      const ownVal = owned[it.id] === undefined ? 0 : owned[it.id];
      let html = '<div class="row' + (done ? ' enough' : '') + (crystal ? ' crystal' : '') + '">' +
                 pickBox(it.id, ownVal) +
                 '<span class="nm" title="' + it.name + '">' + it.name + '</span>' +
                 ownInput(it.id, ownVal) +
                 tagHtml(it.id, hidden) +
                 '<span class="qt">×' + it.deficit + '</span></div>';
      if(withNote && !crystal){
        const node = ITEMS[it.id];
        const bits = [];
        const ex = exchLine(it.id, it.deficit);
        if(ex) bits.push({text: ex, cls: 'exch'});
        const tb = tribeLine(it.id);
        if(tb) bits.push({text: tb, cls: ''});
        if(node && node.备注) bits.push({text: '（' + node.备注 + '）', cls: ''});
        noteItems(it).forEach(n => bits.push({text: n.text, cls: n.done ? 'done-note' : ''}));
        if(bits.length){
          html += '<div class="note">' +
                  bits.map(b => '<div class="' + b.cls + '" title="' + b.text + '">' + b.text + '</div>').join('') +
                  '</div>';
        }
      }
      return html;
    };

    function groupHtml(items, title, hidden, cls){
      const key = boxId + ':' + cls;
      const open = !!OPEN[key];
      return '<div class="xgroup ' + (open ? 'open' : 'closed') + ' ' + (cls || '') +
             '" data-key="' + key + '"><button class="xtoggle" type="button">' +
             (open ? '▾ ' : '▸ ') + title +
             '</button><div class="xbody">' + items.map(it=>rowHtml(it, hidden)).join('') + '</div></div>';
    }

    let groups = '';
    if(g.seal.length){
      const seals = g.seal.reduce((s,x)=> s + sealCost(x.id) * x.need, 0);
      groups += groupHtml(g.seal, '军票兑换 · ' + g.seal.length + ' 种 · 共 ' + seals + ' 军票', ALL_TAGS, 'g-seal');
    }
    if(g.crystal.length){
      groups += groupHtml(g.crystal, '水晶 / 碎晶 / 晶簇 · ' + g.crystal.length + ' 种', ALL_TAGS, 'g-crystal');
    }
    if(g.sub.length){
      groups += groupHtml(g.sub, '仅潜水艇带取 · ' + g.sub.length + ' 种', ['潜水艇带取'], 'g-sub');
    }
    if(g.exch.length){
      groups += groupHtml(g.exch, '风茄 / 薰衣草兑换 · ' + g.exch.length + ' 种', ['风茄兑换', '薰衣草兑换'], 'g-exch');
    }
    if(g.tribe.length){
      groups += groupHtml(g.tribe, '蛮族商人 · ' + g.tribe.length + ' 种', ['蛮族商人'], 'g-tribe');
    }

    let html = '';
    if(groups){
      html += '<div class="groups">' + groups + '</div>';
    }
    html += g.rest.map(it=>rowHtml(it)).join('');

    box.innerHTML = html || '<div class="empty">无</div>';

    box.querySelectorAll('.xtoggle').forEach(function(btn){
      btn.onclick = function(){
        const grp = btn.parentNode;
        const key = grp.getAttribute('data-key');
        const closed = grp.classList.toggle('closed');
        if(key) OPEN[key] = !closed;      // 记住展开状态，重绘后不折叠
        btn.textContent = (closed ? '▸ ' : '▾ ') + btn.textContent.slice(2);
      };
    });

    bindOwn(box);
    document.getElementById(countId).textContent = list.length ? list.length + ' 种' : '';
  }

  function bindOwn(box){
    box.querySelectorAll('input[data-pick]').forEach(inp=>{
      inp.onchange = function(){
        const id = inp.dataset.pick;
        if(inp.checked) owned[id] = -1;
        else delete owned[id];
        render();
      };
    });
    box.querySelectorAll('input[data-own]').forEach(inp=>{
      const id = inp.dataset.own;
      function apply(raw){
        raw = String(raw == null ? inp.value : raw).trim();
        let v;
        if(raw === '') v = 0;
        else if(raw === '-1') v = -1;            // 直接敲 -1 也当作够数
        else v = Math.max(0, Math.floor(Number(raw) || 0));
        if(v === -1 || v > 0) owned[id] = v; else delete owned[id];
        render();
      }
      inp.oninput = function(){ if(String(inp.value).trim() === '-1') apply('-1'); };
      inp.onchange = function(){ apply(); };
      inp.onfocus = function(){ this.select(); };
    });
  }

  // ---------- 交互 ----------
  document.getElementById('progBtn').addEventListener('click', function(){
    document.getElementById('progPanel').classList.toggle('hidden');
  });
  document.getElementById('progClose').addEventListener('click', function(){
    document.getElementById('progPanel').classList.add('hidden');
  });

  document.getElementById('copy').addEventListener('click', ()=>{
    const sel = selections();
    const list = bySeq(toList(compute(sel, owned).base), true).filter(x=>x.deficit > 0);
    const lines = ['配装 ' + buildCode(sel) + ' 缺料清单', ''];
    for(const x of list) lines.push(x.name + ' ×' + x.deficit);
    navigator.clipboard.writeText(lines.join('\n')).then(
      ()=>{ document.getElementById('foot').textContent = '已复制 ' + list.length + ' 种缺料'; },
      ()=>{ document.getElementById('foot').textContent = '复制失败，请手动选择文本'; });
  });

  document.getElementById('csv').addEventListener('click', ()=>{
    const sel = selections();
    const res = compute(sel, owned);
    const rows = [['材料','需要','已有','还缺','获取方式','备注']];
    const baseList = bySeq(toList(res.base));
    const baseIds = {};
    baseList.forEach(x=>{ baseIds[x.id] = true; });
    const push = list => {
      for(const x of list){
        const note = isCrystal(x.name) ? '' : noteLines(x).join('；');
        rows.push([x.name, x.need, x.have === x.need ? '管够' : x.have, x.deficit, '', note]);
      }
    };
    push(baseList);
    push(bySeq(toList(res.join), false).filter(x=>!baseIds[x.id]));
    push(bySeq(toList(res.l3), false).filter(x=>!baseIds[x.id]));
    const csv = rows.map(r=>r.map(c=>'"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '潜水艇材料_' + buildCode(sel) + '.csv';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('foot').textContent =
    '标签：价格（如 2G）= NPC 售价，军票 = 军票兑换，采集 = 可采集，限时 = 限时采集点，' +
    '潜艇 = 潜水艇带取，风茄 / 薰衣草 = 对应兑换，制作 = 需要制作　|　' +
    '每行左侧勾选框 = 这个已经够数；材料名右边的框填已有多少，只算差额；表头勾选 = 整列够数　|　' +
    '顶栏「合建进度」按阶段勾选，交齐的材料会划线　|　' +
    '列与列之间的竖线可以拖动调宽度，双击恢复均分　|　' +
    '生成时间 ' + DATA.buildTime;

  // ---------- 列宽调整：拖动 gutter 改比例，记在本地 ----------
  (function(){
    const board = document.getElementById('board');
    if(!board) return;
    const cols = [].slice.call(board.querySelectorAll('.col'));
    const gutters = [].slice.call(board.querySelectorAll('.gutter'));
    const MIN = 180, KEY = 'ff14sub_colw';
    const narrow = window.matchMedia('(max-width:1200px)');
    let ratios = null;              // 列宽比例；null = 均分

    function widths(){ return cols.map(c => c.getBoundingClientRect().width); }
    function apply(){
      cols.forEach((c, i) => {
        c.style.flex = ratios ? (ratios[i] + ' 1 0') : '';
      });
    }
    function fromWidths(ws){
      const sum = ws.reduce((a, b) => a + b, 0) || 1;
      return ws.map(w => Math.max(0.05, w / sum));
    }
    function save(){
      try {
        if(ratios) localStorage.setItem(KEY, JSON.stringify(ratios.map(r => Math.round(r * 1e4) / 1e4)));
        else localStorage.removeItem(KEY);
      } catch(e){}
    }
    function load(){
      try {
        const v = JSON.parse(localStorage.getItem(KEY) || 'null');
        if(v && v.length === 4 && v.every(n => typeof n === 'number' && n > 0)){
          const sum = v.reduce((a, b) => a + b, 0) || 1;
          return v.map(n => n / sum);
        }
      } catch(e){}
      return null;
    }
    function restore(){
      ratios = narrow.matches ? null : load();
      apply();
    }
    restore();
    if(narrow.addEventListener) narrow.addEventListener('change', restore);

    gutters.forEach(function(g, i){
      g.title = '拖动调整左右两列宽度；双击恢复均分';
      g.addEventListener('pointerdown', function(e){
        if(narrow.matches) return;
        e.preventDefault();
        const ws = widths();
        const pair = ws[i] + ws[i + 1];
        const startX = e.clientX;
        document.body.classList.add('resizing');
        if(g.setPointerCapture) g.setPointerCapture(e.pointerId);

        function move(ev){
          const dx = ev.clientX - startX;
          const left = Math.min(Math.max(ws[i] + dx, MIN), pair - MIN);
          const next = ws.slice();
          next[i] = left;
          next[i + 1] = pair - left;
          ratios = fromWidths(next);
          apply();
        }
        function up(){
          g.removeEventListener('pointermove', move);
          g.removeEventListener('pointerup', up);
          g.removeEventListener('pointercancel', up);
          document.body.classList.remove('resizing');
          save();
        }
        g.addEventListener('pointermove', move);
        g.addEventListener('pointerup', up);
        g.addEventListener('pointercancel', up);
      });
      g.addEventListener('dblclick', function(){
        ratios = null;
        apply();
        save();
      });
    });
  })();

  render();
})();
</script>
</body>
</html>
